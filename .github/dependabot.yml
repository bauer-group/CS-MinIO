# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors Docker base images and GitHub Actions for updates.
# Combined with docker-maintenance.yml workflow for auto-merge and release.
#
# The commit prefix decides whether a merged update is released: fix(...)
# cuts a PATCH release and rebuilds the images, chore(...) releases nothing.
# Everything that ends up in the shipped images uses fix(...); GitHub
# Actions updates stay chore(ci) (no release, never auto-merged).
# =============================================================================

version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker base image updates - MinIO server
  - package-ecosystem: "docker"
    directory: "/src/minio"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # Docker base image updates - MinIO init
  - package-ecosystem: "docker"
    directory: "/src/minio-init"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"
