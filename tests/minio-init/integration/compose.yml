# =============================================================================
# minio-init integration rig (driven by run.sh)
# =============================================================================
#   minio  the released MinIO server image, as consumers run it
#   hook   a stand-in webhook receiver, so a notification target can register
#   init   the minio-init image built from src/minio-init (the code under test)
#
# Secrets come from run.sh, which generates them per run. IT_CONFIG selects
# the scenario config under configs/.
# =============================================================================

name: minio-init-it

services:
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/bauer-group/cs-minio/minio}:${MINIO_VERSION:-latest}
    command: server --address ":9000" /data
    environment:
      MINIO_ROOT_USER: it-root
      MINIO_ROOT_PASSWORD: ${IT_ROOT_PASSWORD:?generated by run.sh}
      MINIO_REGION_NAME: eu-central-1
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60

  hook:
    image: python:3-alpine
    command: ["python", "-m", "http.server", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 2s
      timeout: 5s
      retries: 30

  init:
    build: ../../../src/minio-init
    image: minio-init:it
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: it-root
      MINIO_ROOT_PASSWORD: ${IT_ROOT_PASSWORD:?generated by run.sh}
      MINIO_WAIT_TIMEOUT: "60"
      CONSOLE_USER: it-console
      CONSOLE_PASSWORD: ${IT_CONSOLE_PASSWORD:?generated by run.sh}
      IT_APP_PASSWORD: ${IT_APP_PASSWORD:?generated by run.sh}
      # The optional user of ok.json: variable set, value empty.
      IT_BACKUP_PASSWORD: ""
      IT_SHORT_PASSWORD: ${IT_SHORT_PASSWORD:?generated by run.sh}
      WEBHOOK_AUTH_TOKEN: ${IT_WEBHOOK_TOKEN:?generated by run.sh}
      # Wide log lines, so run.sh can grep whole messages.
      COLUMNS: "250"
    volumes:
      - ./${IT_CONFIG:-configs/ok.json}:/app/config/init.json:ro
      - credentials:/data/credentials

volumes:
  minio-data:
  credentials:
