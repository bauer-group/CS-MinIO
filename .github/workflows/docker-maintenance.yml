# =============================================================================
# Docker Maintenance - Auto-merge Dependabot PRs
# =============================================================================
# Hands every Dependabot PR to the reusable docker-maintenance-dependabot
# workflow. It merges a PR only after the pull_request run of
# docker-release.yml (compose validation, minio-init unit and integration
# tests, all image builds) has passed on the PR head commit.
#
# Trigger scope: no paths filter on purpose. Every Dependabot PR, whatever
# its ecosystem, reaches the module and gets an explicit decision and
# annotation instead of silently staying open:
# - docker (src/minio, src/minio-init): changes src/**, which starts
#   docker-release.yml - patch and minor updates are merged once that run
#   passed; majors stay manual (merge-update-types default)
# - github-actions, or any other change under .github/: left open by the
#   module's own guard - CI changes are merged by hand
# - any ecosystem whose files docker-release.yml does not watch: left open
#   as "not tested"
#
# A merge made with the GITHUB_TOKEN starts no push workflow, so after the
# merge this workflow dispatches docker-release.yml on main and waits for
# it (release-workflow). That run tests and builds the merged commit again
# and only then:
# 1. Creates a semantic release (fix(docker) -> PATCH)
# 2. Builds and pushes the new Docker images
# A release run that does not succeed turns this job red.
# =============================================================================

name: "🔧 Docker Maintenance"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # tests the init container and builds the images.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
